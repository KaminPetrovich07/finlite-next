# ════════════════════════════════════════════════════════════════════════
# FinLite KG на собственном сервере. Запуск (из папки deploy):
#   cp env.example .env   # заполнить пароли и адрес
#   docker compose up -d --build
# Подробно — deploy/README.md.
#
#   proxy  — Caddy: HTTPS (свой сертификат или внутренний центр), порты 80/443
#   app    — приложение (Next.js), наружу не открыто, только через proxy
#   db     — PostgreSQL 16, данные в томе pgdata, наружу не открыт
#   cron   — плановые задачи (курсы НБКР, напоминания, редакции законов)
#   backup — ежедневная копия базы в ./backups
# ════════════════════════════════════════════════════════════════════════
name: finlite

x-db-env: &db-env
  POSTGRES_DB: finlite
  POSTGRES_USER: finlite
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в deploy/.env}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlite -d finlite"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FL_AUTH: "on"
    image: finlite-kg:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://finlite:${POSTGRES_PASSWORD}@db:5432/finlite?schema=public
      FL_ADMIN_EMAILS: ${FL_ADMIN_EMAILS:?задайте FL_ADMIN_EMAILS в deploy/.env}
      CRON_SECRET: ${CRON_SECRET:?задайте CRON_SECRET в deploy/.env}
      FL_SITE_URL: ${FL_SITE_URL:-}
      FL_TRUSTED_PROXIES: "1"
      FL_DB_LIMIT_MB: ${FL_DB_LIMIT_MB:-51200}
      FL_AUDIT_DAYS: ${FL_AUDIT_DAYS:-1825}
      FL_OPERATOR_NAME: ${FL_OPERATOR_NAME:-}
      FL_OPERATOR_DETAILS: ${FL_OPERATOR_DETAILS:-}
      FL_CONTACT_EMAIL: ${FL_CONTACT_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FL_MAIL_FROM: ${FL_MAIL_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # ИИ-категоризация выписки отправляет назначения платежей во внешний сервис —
      # по умолчанию выключена; включайте только если это допускает регламент.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    expose: ["3000"]
    networks: [internal, web]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${FL_HTTP_PORT:-80}:80"
      - "${FL_HTTPS_PORT:-443}:443"
    environment:
      FL_SITE_ADDRESS: ${FL_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  cron:
    image: finlite-kg:latest
    restart: unless-stopped
    depends_on: [app]
    entrypoint: ["/usr/bin/tini", "--", "node", "/app/deploy/cron.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET}
      FL_APP_URL: http://app:3000
    healthcheck: { disable: true }
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *db-env
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  web:
